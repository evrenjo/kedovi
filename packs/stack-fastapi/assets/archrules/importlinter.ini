# 패키지 구조 검사 (kedovi archrules fastapi 로 만든 파일, 프로젝트에 맞게 고쳐 쓴다)
# 실행: lint-imports   (필요: pip install import-linter)
# 기능 사이 경계(다른 기능은 service · schemas · models · exceptions 만)는 tools/check_role_files.py 가 본다

[importlinter]
root_package = __PACKAGE__

# 기능 안 계층 방향: 위가 아래를 import 한다. 괄호 = 없어도 되는 파일, ':' = 서로 import 해도 되는 형제, '|' = 서로 모르는 형제
[importlinter:contract:feature-layers]
name = 기능 안 계층 방향 (router → service → repository · mapper → models · schemas)
type = layers
containers =
    __PACKAGE__.feature.*
layers =
    (router)
    (dependencies)
    (service)
    (repository) | (mapper) | (client)
    (models) : (schemas)
    (exceptions)

# 하위 기능도 같은 방향
[importlinter:contract:subfeature-layers]
name = 하위 기능 안 계층 방향
type = layers
containers =
    __PACKAGE__.feature.*.*
layers =
    (router)
    (dependencies)
    (service)
    (repository) | (mapper) | (client)
    (models) : (schemas)
    (exceptions)

# 전역 설정 · 공통은 기능을 모른다
[importlinter:contract:config-shared-no-feature]
name = config · shared 는 feature 를 import 하지 않는다
type = forbidden
source_modules =
    __PACKAGE__.config
    __PACKAGE__.shared
forbidden_modules =
    __PACKAGE__.feature
allow_indirect_imports = True
