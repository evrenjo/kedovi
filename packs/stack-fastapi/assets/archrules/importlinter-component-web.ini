# 패키지 구조 검사 · component-web (kedovi archrules fastapi 로 만든 파일, 프로젝트에 맞게 고쳐 쓴다)
# 실행: lint-imports   (필요: pip install import-linter)
# 화면끼리 · web → 기능 공개 파일 · 고객사 경계 · 파일 배치는 tools/check_role_files.py 가 본다

[importlinter]
root_package = __PACKAGE__

# 기능 안 계층 방향 (진입점 router 는 web 으로 갔다)
[importlinter:contract:feature-layers]
name = 기능 안 계층 방향 (service → repository · mapper → models · schemas)
type = layers
containers =
    __PACKAGE__.feature.*
layers =
    (dependencies)
    (service)
    (repository) | (mapper) | (client)
    (models) : (schemas)
    (exceptions)

[importlinter:contract:subfeature-layers]
name = 하위 기능 안 계층 방향
type = layers
containers =
    __PACKAGE__.feature.*.*
layers =
    (dependencies)
    (service)
    (repository) | (mapper) | (client)
    (models) : (schemas)
    (exceptions)

# 방향: web → feature → shared. 기능은 web 을 모른다
[importlinter:contract:feature-no-web]
name = feature 는 web 을 import 하지 않는다
type = forbidden
source_modules =
    __PACKAGE__.feature
forbidden_modules =
    __PACKAGE__.web
allow_indirect_imports = True

# 전역 설정 · 공통은 기능 · web 을 모른다
[importlinter:contract:config-shared-no-feature]
name = config · shared 는 feature · web 을 import 하지 않는다
type = forbidden
source_modules =
    __PACKAGE__.config
    __PACKAGE__.shared
forbidden_modules =
    __PACKAGE__.feature
    __PACKAGE__.web
allow_indirect_imports = True

# 고객사 코드(customer/<고객>)를 쓰면 주석을 푼다: 공통은 고객사를 모른다
