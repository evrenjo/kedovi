# 실패 주입 세트 CI 작업 (kedovi apiledger add 가 넣음). .gitlab-ci.yml 에서 가져온다:
#   include:
#     - local: ci/api-faults.gitlab-ci.yml
# test 와 같은 단계에서 병렬로 돈다 (needs: [] 라 앞 단계를 기다리지 않는다). 개발 루프(커밋 · 일반 test)에는 대기를 더하지 않는다.
# image · before_script · cache 는 이 repo 의 test 작업과 같게 맞춘다 (extends 로 가져오면 한 곳만 고친다).
api-faults:
  stage: test
  needs: []
  interruptible: true
  timeout: 15m
  # extends: .test          # 프로젝트 test 작업 기반이 있으면
  script:
    - __FAULTS_CMD__
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - .api-ledger/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
