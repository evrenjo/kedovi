# 쓰기 보고서 설정 (시험이 DB 에 쓴 것을 기록 · 고정한다). 키 뜻은 kedovi 킷의 packs/core/assets/write-report/FORMAT.md.
# 모든 키는 생략할 수 있다 (생략하면 주석의 기본값).

# 시험별 원본 YAML · index.json · index.html 을 쓰는 곳. 기본: Gradle build/write-report, Maven target/write-report
#output=build/write-report

# 승인본(기대값) 폴더. repo 에 커밋한다
#approved=src/test/resources/write-report/approved

# index.json 의 repo 이름. 기본: 작업 폴더 이름
#repo=

# 생성 ID 로 볼 컬럼 (스키마.테이블.컬럼 또는 테이블.컬럼). 값은 <컬럼-n>, n 은 그 시험 안 원값 숫자 오름차순 번호.
# 생략하면 기본 키 하나짜리 숫자 컬럼 중 DB 가 값을 만드는 것(identity · serial · nextval 기본값)
#ids=app.orders.id,app.order_items.id

# 실제 시각이 들어가는 컬럼. 값이 있으면 <now>. 시험 시계(Clock)로 정한 컬럼은 넣지 않는다
#now=created_at,updated_at,inserted_at,modified_at

# 오류 메시지에 더 적용할 정규식 (정규식=>바꿀 글). 번호 순서로 적용한다
#replace.1=\\(at offset \\d+\\)=>

# 컬럼을 모르는 바인드 값: type(기본, <text:길이> · <number> · <time>) | hide("***") | show(그대로)
#mask.unknownBinds=type

# 통째로 기록하지 않을 테이블 (와일드카드 *, 스키마 붙여도 됨). 적으면 기본값을 대신한다
#exclude.tables=batch_*,qrtz_*,flyway_schema_history,databasechangelog*,shedlock

# 이 컬럼만 SET 하는 UPDATE 는 기록하지 않고 개수만 센다 (테이블:컬럼,컬럼)
#exclude.updatesOnly.1=app.scheduler_jobs:next_fire_at,updated_at
