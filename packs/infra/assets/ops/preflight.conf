# preflight 설정 (preflight.sh 가 bash 로 읽는다. 값에 비밀번호를 적지 않는다: 접속 정보는 컨테이너 환경 변수 · .pgpass 등에서)

# compose 명령 (-f · -p 를 붙여도 된다)
COMPOSE="docker compose"

# 같은 태그의 새 이미지를 비교하려면 1: preflight 가 먼저 pull 한다 (0 이면 이미 pull · build 한 로컬 이미지와 비교)
PULL=0

# ① 도는 배치 조회: 실행 중인 작업을 한 줄에 하나 「id|작업 이름|상태|시작 시각」 으로 찍는 명령. 비우면 ① 을 건너뛴다.
#    출력이 비면 도는 배치 0. 명령이 실패하면 확인 못 함으로 보고 멈춘다.
BATCH_QUERY=''
# 예: Spring Batch 메타 테이블 (PostgreSQL 컨테이너 db, 끝나지 않은 실행 = end_time 없음)
# BATCH_QUERY='docker compose exec -T db psql -U app -d app -At -F"|" -c "select e.job_execution_id, i.job_name, e.status, e.start_time from batch_job_execution e join batch_job_instance i on i.job_instance_id = e.job_instance_id where e.end_time is null order by e.job_execution_id"'
# 예: MySQL
# BATCH_QUERY='docker compose exec -T db mysql -N -B app -e "select e.job_execution_id, i.job_name, e.status, e.start_time from BATCH_JOB_EXECUTION e join BATCH_JOB_INSTANCE i on i.job_instance_id = e.job_instance_id where e.end_time is null" | tr "\t" "|"'

# 배치를 돌리는 서비스 (빈칸으로 나눔). 이 서비스가 재생성될 때만 ① 을 본다. 비우면 무엇이 바뀌든 본다
BATCH_SERVICES=""

# 분 주기 작업 이름 (확장 정규식). 이 작업들만 돌면 끝나는 틈을 기다리고, 다른 작업이 돌면 멈춘다. 비우면 도는 배치가 있으면 멈춘다
MINUTE_JOBS=''
# 예: MINUTE_JOBS='^(MINUTE_|HEARTBEAT_)'

# 분 주기 작업이 끝나는 틈을 기다릴 최대 초 · 다시 조회할 간격 초
WAIT_MAX=90
POLL_SEC=2

# ③ 재생성되면 사라지는 상태: 한 줄에 「서비스|수준|설명」
#    수준 block = 멈춤 (--force · PREFLIGHT_FORCE=1 로만 진행) · warn = 보이고 진행
#    볼륨에 남는 것은 「남는다」 고 적어 두면 판단이 빠르다
STATES='
# api|block|로그인 세션(메모리 저장)이 사라져 사용자가 다시 로그인한다
# ws|block|웹소켓 연결이 끊긴다 (클라이언트 재연결 확인 뒤 진행)
# collector|warn|수집이 잠깐 멈춘다 (WAL 은 볼륨에 남는다)
'
